services:
  postgres:
    image: postgres:18
    container_name: task-management-db
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  task-management-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      DB_HOST: task-management-db
    ports:
      - "8080:8080"

     

volumes:
  postgres_data: